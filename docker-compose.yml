services:
  app:
    build: .
    image: pvdes:latest
    restart: unless-stopped
    environment:
      PVDES_DATA_DIR: /data
      STATIC_DIR: /app/static
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "8000:8000"
    volumes:
      - pvdes-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pvdes-data:
