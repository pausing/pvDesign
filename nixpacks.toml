# Dokploy Application — Build type: Nixpacks
# Python API + Vite UI. Official Node 22.14 is installed because Nixpacks
# nodejs_22 is 22.10, which cannot install Rolldown's Linux native binding.

providers = ["python"]

[variables]
NIXPACKS_PYTHON_VERSION = "3.12"
NODE_OPTIONS = "--max-old-space-size=1536"
STATIC_DIR = "frontend/dist"
PVDES_DATA_DIR = "/data"

[phases.setup]
nixPkgs = ["..."]
aptPkgs = ["curl", "xz-utils", "ca-certificates"]

[phases.install]
cmds = [
  "...",
  "bash scripts/install-node.sh",
  "export PATH=/usr/local/bin:$PATH && cd frontend && npm ci --include=dev --include=optional",
]

[phases.build]
cmds = ["export PATH=/usr/local/bin:$PATH && npm run build --prefix frontend"]

[start]
cmd = "uvicorn app.main:app --host 0.0.0.0 --port 8000 --app-dir backend"
